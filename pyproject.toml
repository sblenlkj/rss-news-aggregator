[project]
name = "news-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "blenlkj", email = "sblenlkj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pymorphy3>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "navec>=0.10,<1",
    "numpy>=1.26,<3",
    "langchain-gigachat>=0.5.1,<1",
    "qdrant-client>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
]

[project.scripts]
news-aggregator = "news_aggregator:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
